# ================================================================
# GitHub Actions CI 工作流
# 运行：单元测试、静态分析、固件构建、Renode/QEMU 集成测试
# ================================================================
name: Mini Kernel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
  RENODE_VERSION: "1.14.0"

jobs:
  # ------------------------------------------------------------
  # 1. 代码风格与静态分析
  # ------------------------------------------------------------
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format-15

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --inline-suppr --force -j4 \
            kernel/ port/ tests/ 2>&1 | tee cppcheck.log
          # 允许风格警告，仅错误阻塞
          ! grep -E "error:" cppcheck.log

      - name: Run clang-format check
        run: |
          find kernel port tests -name "*.c" -o -name "*.h" -o -name "*.S" | \
            xargs clang-format-15 --dry-run --Werror

  # ------------------------------------------------------------
  # 2. 单元测试（本地运行，Unity）
  # ------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ make

      - name: Fetch Unity submodule
        run: |
          git submodule update --init external/unity

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DPICO_SDK_PATH=$PICO_SDK_PATH

      - name: Build unit tests
        run: |
          cmake --build build --target unit_tests -j4

      - name: Run unit tests
        run: |
          cd build && ./unit_tests 2>&1 | tee unit_test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: build/unit_test.log

  # ------------------------------------------------------------
  # 3. 固件构建（RP2040，体积红线检查）
  # ------------------------------------------------------------
  build-firmware:
    name: Build Firmware (RP2040)
    runs-on: ubuntu-latest
    needs: [static-analysis, unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pico SDK
        run: |
          git clone --depth 1 -b master https://github.com/raspberrypi/pico-sdk.git $PICO_SDK_PATH
          cd $PICO_SDK_PATH && git submodule update --init

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake make ninja-build

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH=$PICO_SDK_PATH \
            -G Ninja

      - name: Build firmware
        run: |
          cmake --build build -j4 2>&1 | tee build.log

      - name: Check firmware size
        run: |
          # 体积检查已在 CMake POST_BUILD 中自动执行
          # 这里额外打印 map 文件摘要
          if [ -f build/mini_kernel.map ]; then
            echo "=== Firmware Size Summary ==="
            grep -E "^\.text|\.rodata|\.data|\.bss" build/mini_kernel.map | head -20
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-rp2040
          path: |
            build/mini_kernel.elf
            build/mini_kernel.bin
            build/mini_kernel.uf2
            build/mini_kernel.map
            build/build.log
          retention-days: 7

  # ------------------------------------------------------------
  # 4. Renode 集成测试
  # ------------------------------------------------------------
  renode-integration:
    name: Renode Integration Test
    runs-on: ubuntu-latest
    needs: build-firmware
    if: ${{ hashFiles('tests/integration/renode_test.py') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-rp2040
          path: build/

      - name: Install Renode
        run: |
          wget -q https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode_${RENODE_VERSION}.deb
          sudo apt-get install -y ./renode_${RENODE_VERSION}.deb

      - name: Run Renode test
        run: |
          python3 tests/integration/renode_test.py build/mini_kernel.elf
        env:
          RENODE_PATH: renode
          FIRMWARE_ELF: build/mini_kernel.elf

  # ------------------------------------------------------------
  # 5. QEMU 集成测试（备选，无需 Renode）
  # ------------------------------------------------------------
  qemu-integration:
    name: QEMU Integration Test
    runs-on: ubuntu-latest
    needs: build-firmware
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-rp2040
          path: build/

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Run QEMU test
        run: |
          chmod +x tests/integration/qemu_test.sh
          tests/integration/qemu_test.sh build/mini_kernel.elf

  # ------------------------------------------------------------
  # 6. 发布构建（标签触发）
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-firmware, renode-integration, qemu-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-rp2040
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mini_kernel.elf
            release/mini_kernel.bin
            release/mini_kernel.uf2
            release/mini_kernel.map
          generate_release_notes: true