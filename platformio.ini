; ================================================================
; Mini Kernel - PlatformIO 配置
; 目标：RP2040 (Raspberry Pi Pico)
; 特性：分层构建、裁剪宏自动传递、单测、静态分析
; ================================================================
[platformio]
default_envs = pico
src_dir = .

[env:pico]
platform = raspberrypi
board = pico
framework = pico-sdk

; 源文件：项目根目录下按目录筛选
build_src_filter = +<kernel/core/> +<port/rp2040/> -<tests/> -<.github/> -<cmake/> -<scripts/>

; 编译器标志
build_flags =
    ; 核心架构
    -mcpu=cortex-m0plus
    -mthumb
    -mfloat-abi=soft
    ; 优化与体积
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-common
    ; 警告
    -Wall
    -Wextra
    -Wpedantic
    -Wshadow
    -Wpointer-arith
    -Wcast-align
    -Wstrict-prototypes
    -Wmissing-prototypes
    -Werror=implicit-function-declaration
    ; C 标准
    -std=gnu11
    ; 包含目录
    -Iinclude
    -Iinclude/hal
    -Ikernel/core
    -Ikernel/syscall
    -Ikernel/modules/periph
    -Ikernel/modules/shell
    -Ikernel/modules/vfs
    -Ikernel/modules/loader
    -Iport/rp2040
    ; 链接器
    -Wl,--gc-sections
    -Wl,--print-memory-usage
    -Wl,-Map=${PROGNAME}.map
    -Wl,-T${PROJECT_DIR}/port/rp2040/rp2040.ld
    -nostartfiles
    -specs=nano.specs
    -specs=nosys.specs

; 从 os_config.h 自动提取 OS_CFG_* 宏并注入
; PlatformIO 支持 Python 脚本预处理
extra_scripts = pre:scripts/gen_config_macros.py

; 库依赖（Pico SDK 模块）
lib_deps =
    ; 无需外部库，直接链接 SDK 组件

; 监视器配置
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 上传配置
upload_protocol = picotool
upload_port = /dev/ttyACM0

; ================================================================
; 单元测试环境（本地运行，使用 Unity + GCC）
; ================================================================
[env:unit_test]
platform = native
build_flags =
    -std=gnu11
    -Wall -Wextra -Wpedantic
    -Iinclude -Iinclude/hal -Ikernel/core -Ikernel/syscall -Ikernel/modules/periph -Ikernel/modules/shell -Ikernel/modules/vfs -Ikernel/modules/loader -Iport/rp2040
    -I${PROJECT_DIR}/tests/unit
    -DUNITY_INCLUDE_CONFIG_H
    -DTEST_BUILD=1
    ; 模拟 HAL 接口
    -DOS_CFG_PERIPH_SERVICE=0
    -DOS_CFG_SHELL=0
    -DOS_CFG_VFS=0
    -DOS_CFG_FATFS=0
    -DOS_CFG_LOADER=0
test_filter = *
test_ignore =

; ================================================================
; 静态分析环境
; ================================================================
[env:static_analysis]
platform = native
build_flags =
    -std=gnu11
    -Wall -Wextra -Wpedantic
    -Iinclude -Iinclude/hal -Ikernel/core -Ikernel/syscall -Ikernel/modules/periph -Ikernel/modules/shell -Ikernel/modules/vfs -Ikernel/modules/loader -Iport/rp2040
    --analyze
check_tool = cppcheck
check_flags =
    --enable=all
    --suppress=missingIncludeSystem
    --inline-suppr
    --force
    -j4
    ${PROJECT_DIR}/kernel ${PROJECT_DIR}/port ${PROJECT_DIR}/tests

; ================================================================
; 代码格式化环境
; ================================================================
[env:format]
platform = native
check_tool = clangtidy
check_flags = --style=file -i